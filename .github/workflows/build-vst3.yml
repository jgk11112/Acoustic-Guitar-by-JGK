name: Build Acoustic Guitar by JGK

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Acoustic_Guitar_by_JGK -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AcousticGuitarByJGK_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Acoustic-Guitar-by-JGK-VST3
          path: build/AcousticGuitarByJGK_artefacts/Release/VST3/**
